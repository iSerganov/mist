name: Bump Homebrew formula

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  bump:
    name: Update Formula/mist.rb
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: master
      - name: Rewrite url and sha256
        run: |
          url="https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${TAG}.tar.gz"
          sha=$(curl -fsSL --retry 5 --retry-all-errors "$url" | sha256sum | cut -d' ' -f1)
          sed -i -E \
            -e "s|^  url \".*\"|  url \"${url}\"|" \
            -e "s|^  sha256 \".*\"|  sha256 \"${sha}\"|" \
            Formula/mist.rb
      - name: Commit
        run: |
          git diff --quiet Formula/mist.rb && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Formula: bump mist to ${TAG}" Formula/mist.rb
          git push origin HEAD:master
